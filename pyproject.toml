[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fred-ai"
version = "0.1.0"
description = "Fred AI - A modular AI agent with extensible tools and memory"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Fred AI Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "black",
    "ruff",
]

[project.scripts]
fred = "fred_ai.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/fred-ai"
Repository = "https://github.com/yourusername/fred-ai"

[tool.setuptools.packages.find]
where = ["."]
include = ["fred_ai*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
